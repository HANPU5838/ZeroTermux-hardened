afterEvaluate {
    // 原生编译会把 bootstrap-*.zip 用 .incbin 直接嵌进 .so，而它的执行时机比
    // Java 编译更早；只挂在 JavaWithJavac 上会漏，CI 上就会报
    // "Could not find incbin file 'bootstrap-aarch64.zip'"。所以挂到 preBuild
    // 与所有 ExternalNativeBuild 任务上（Gradle 会自己去重，避免重复下载）。
    tasks.configureEach { task ->
        def name = task.name
        if (name.endsWith("JavaWithJavac") ||
            name.endsWith("JavaWithJavacCreation") ||
            name == "preBuild" ||
            name.toLowerCase().contains("externalnativebuild")) {
            task.dependsOn(downloadBootstraps)
        }
    }
}
