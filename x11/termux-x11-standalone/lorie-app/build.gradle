// ZeroTermux hardened 修改 {@
// 本模块是「外部通道」独立 Termux:X11 APK 的宿主：
// - namespace 保持 com.termux.x11.app，applicationId 必须是 com.termux.x11
//   （ZeroTermux 的外部通道 loader 会校验该包名与签名）
// - 简化掉上游的 sharedUid 变体（ZeroTermux 只使用 standalone）
// @}

apply plugin: 'com.android.application'
apply from: '../lorie/version.gradle'

android {
    namespace 'com.termux.x11.app'
    compileSdk = 37
    compileSdkMinor = 1

    defaultConfig {
        applicationId "com.termux.x11"
        minSdk = 24
        // ZeroTermux hardened：与上游一致保持 34（避免强制 edge-to-edge 与 16KB 页限制）
        targetSdk = 34
        versionCode 17
        versionName termuxX11VersionName
    }

    signingConfigs.debug {
        storeFile file('testkey_untrusted.jks')
        keyAlias 'alias'
        storePassword 'xrj45yWGLbsO7W0v'
        keyPassword 'xrj45yWGLbsO7W0v'
    }

    compileOptions.sourceCompatibility JavaVersion.VERSION_17
    compileOptions.targetCompatibility JavaVersion.VERSION_17

    buildTypes.debug {
        signingConfig signingConfigs.debug
        minifyEnabled true
        shrinkResources true
        proguardFiles 'proguard-rules.pro'
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.each { output ->
                output.outputFileName.set("termux-x11-${variant.buildType}-universal.apk")
            }
        }
    }
}

dependencies {
    implementation project(':lorie')
}
