# ============================================================
#  依赖版本目录（Version Catalog）
#  所有依赖版本统一在这里维护，构建脚本只引用别名。
#  最后更新：2026-10-18
# ============================================================

[versions]
# 构建工具（AGP 版本在根 build.gradle 的 buildscript 中固定为最新稳定版）
agp = "9.5.1"

# AndroidX / Google（最新稳定版）
androidxAnnotation = "1.11.0"
androidxLocalbroadcastmanager = "1.1.0"
androidxDocumentfile = "1.1.0"
androidxCore = "1.19.1"
androidxAppcompat = "1.8.0"
androidxMaterial = "1.14.0"
androidxDrawerlayout = "1.2.0"
androidxPreference = "1.2.1"
androidxViewpager = "1.1.0"
androidxCardview = "1.0.0"
androidxConstraintlayout = "2.2.2"
androidxSwiperefreshlayout = "1.1.0"
androidxLifecycle = "2.11.0"
androidxWindow = "1.5.1"
androidxTestJunit = "1.3.0"
desugar = "2.1.5"

# Kotlin / 网络 / 序列化 / 图片 / 工具
coroutines = "1.11.0"
okhttp = "4.12.0"
gson = "2.15.0"
guava = "33.8.0-android"
jsoup = "1.24.1"
zxing = "3.5.4"
glide = "5.0.9"
ddplist = "1.30"
junit = "4.13.2"
robolectric = "4.17"

# 第三方（JitPack / Maven Central）
fastandrutils = "0.8.0"
okgo = "3.0.4"
switchbutton = "1.0.5"
xxpermissions = "11.5"
numberprogressbar = "1.4"
aria = "3.8.16"
libsu = "6.0.0"
rootbeer = "0.1.2"
libaums = "0.9.0"
usbdeviceenumerator = "2.0.0"
agentweb = "4.0.2"
colorseekbar = "2.1.0"
imagepicker = "2.2.7"
smartswipe = "1.1.0"
immersionbar = "3.3.3"
adblib = "1.3"
commonsFileupload = "1.6.0"
commonsNet = "3.13.0"
nanohttpd = "2.3.1"
servletApi = "2.5"
un7zip = "1.7.1"
pluginLocale = "1.0.12"
hiddenapibypass = "6.2"
markwon = "4.6.2"
editor = "0.24.4"
slf4j = "2.0.20"
reload4j = "1.2.27"
termuxAm = "2.0.0"

[libraries]
# ---- AndroidX / Google ----
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "androidxLocalbroadcastmanager" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidxDocumentfile" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-material = { module = "com.google.android.material:material", version.ref = "androidxMaterial" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "androidxDrawerlayout" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidxPreference" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "androidxViewpager" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidxCardview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidxSwiperefreshlayout" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-window = { module = "androidx.window:window", version.ref = "androidxWindow" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
guava-listenablefuture = { module = "com.google.guava:listenablefuture", version = "9999.0-empty-to-avoid-conflict-with-guava" }

# ---- Kotlin / 网络 / 序列化 / 图片 ----
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
ddplist = { module = "com.googlecode.plist:dd-plist", version.ref = "ddplist" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# ---- 第三方 ----
fastandrutils = { module = "cn.hotapk:fastandrutils", version.ref = "fastandrutils" }
okgo = { module = "com.lzy.net:okgo", version.ref = "okgo" }
switchbutton = { module = "com.github.iielse:switchbutton", version.ref = "switchbutton" }
xxpermissions = { module = "com.github.getActivity:XXPermissions", version.ref = "xxpermissions" }
numberprogressbar = { module = "com.daimajia.numberprogressbar:library", version.ref = "numberprogressbar" }
aria-core = { module = "me.laoyuyu.aria:core", version.ref = "aria" }
aria-compiler = { module = "me.laoyuyu.aria:compiler", version.ref = "aria" }
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsu" }
libsu-nio = { module = "com.github.topjohnwu.libsu:nio", version.ref = "libsu" }
rootbeer = { module = "com.scottyab:rootbeer-lib", version.ref = "rootbeer" }
libaums = { module = "me.jahnen:libaums", version.ref = "libaums" }
usbdeviceenumerator = { module = "uk.co.alt236:usbdeviceenumerator", version.ref = "usbdeviceenumerator" }
agentweb = { module = "com.just.agentweb:agentweb", version.ref = "agentweb" }
agentweb-download = { module = "com.just.agentweb:download", version.ref = "agentweb" }
colorseekbar = { module = "com.github.rtugeek:colorseekbar", version.ref = "colorseekbar" }
imagepicker = { module = "com.lcw.library:imagepicker", version.ref = "imagepicker" }
smart-swipe = { module = "com.billy.android:smart-swipe", version.ref = "smartswipe" }
smart-swipe-x = { module = "com.billy.android:smart-swipe-x", version.ref = "smartswipe" }
immersionbar = { module = "com.geyifeng.immersionbar:immersionbar", version.ref = "immersionbar" }
adblib = { module = "com.tananaev:adblib", version.ref = "adblib" }
commons-fileupload = { module = "commons-fileupload:commons-fileupload", version.ref = "commonsFileupload" }
commons-net = { module = "commons-net:commons-net", version.ref = "commonsNet" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpd" }
servlet-api = { module = "javax.servlet:servlet-api", version.ref = "servletApi" }
un7zip = { module = "com.hzy:un7zip", version.ref = "un7zip" }
plugin-locale = { module = "com.mallotec.reb:plugin-locale", version.ref = "pluginLocale" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
termux-am-library = { module = "com.termux:termux-am-library", version.ref = "termuxAm" }
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-ext-strikethrough = { module = "io.noties.markwon:ext-strikethrough", version.ref = "markwon" }
markwon-ext-tables = { module = "io.noties.markwon:ext-tables", version.ref = "markwon" }
markwon-linkify = { module = "io.noties.markwon:linkify", version.ref = "markwon" }
markwon-recycler = { module = "io.noties.markwon:recycler", version.ref = "markwon" }
editor = { module = "io.github.rosemoe:editor", version.ref = "editor" }
editor-language-textmate = { module = "io.github.rosemoe:language-textmate", version.ref = "editor" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-reload4j = { module = "org.slf4j:slf4j-reload4j", version.ref = "slf4j" }
reload4j = { module = "ch.qos.reload4j:reload4j", version.ref = "reload4j" }
