name: Build APK

# 用 GitHub 托管 Runner 编译 ZeroTermux 加固版
# - 手动触发：Actions 页面 Run workflow，可选 ABI
# - 推送 tag（v*）时自动构建并挂到 Release
on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标 ABI（arm64 / all / universal / x86 / x86_64 / arm）'
        required: false
        default: 'arm64'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: assembleRelease (${{ inputs.arch || 'arm64' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0 ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: true

      - name: Print toolchain versions
        run: |
          echo "JAVA: $(java -version 2>&1 | head -1)"
          echo "SDK root: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build release APK
        env:
          ARCH: ${{ inputs.arch || 'arm64' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -Darch="$ARCH" --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          find 垃圾箱/build/app/outputs/apk/release -name '*.apk' -exec cp -v {} out/ \;
          find 垃圾箱/build/app/outputs/mapping -name '*.txt' -exec cp -v {} out/ \; 2>/dev/null || true
          ls -lh out
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTermux-release-apk
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
